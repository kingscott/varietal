services:
  varietal:
    build: .
    image: varietal
    init: true
    ports:
      # Loopback only: the API has no authentication. To expose it on your
      # network, change this to "3000:3000" (and put auth or a proxy in front).
      - "127.0.0.1:3000:3000"
    volumes:
      - varietal-data:/app/data
    restart: unless-stopped

volumes:
  varietal-data:
